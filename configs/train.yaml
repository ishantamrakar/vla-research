defaults:
  - _self_

hydra:
  run:
    dir: ${output_dir}
  job:
    chdir: false

experiment_name: "default"
output_dir: "outputs/train/${experiment_name}"

device: "cuda"
seed: 42

train:
  steps: 500
  batch_size: 8
  num_workers: 4
  grad_clip_norm: 10.0

policy:
  type: "diffusion"
  # You can specify other diffusion config overrides here

dataset:
  repo_id: "lerobot/pusht"
  # You can add overrides for dataset config if necessary

env:
  type: "pusht"
  task: "PushT-v0"

optimizer:
  type: "adamw"
  lr: 1e-4
  weight_decay: 1e-4

wandb:
  enable: true
  project: "vla-research"
  entity: null
  name: "${experiment_name}"

eval:
  eval_freq: 500
  n_episodes: 5
  batch_size: 1

